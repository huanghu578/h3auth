[package]
name = "h3auth"
version = "0.1.0"
edition = "2021"
description = "Authentication library based on three hardware components: UUID, motherboard serial number, BIOS serial number"
license = "MIT OR Apache-2.0"
repository = "https://github.com/huanghu578/h3auth"
readme = "README.md"
keywords = ["Authentication", "serial", "hardware"]
categories = ["Encryption","Decryption"]

[dependencies]
regex = "1.10"
hex = "0.4"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2.0.21"
rand = "0.8"           # 若用 OsRng 生成 salt

[target.'cfg(windows)'.dependencies]
wmi = "0.15"
serde = { version = "1", features = ["derive"] }